<!DOCTYPE html>
<html>
<head>
  <title>Operation Red Horizon</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Operation Red Horizon</h1>

<div id="game">

  <div class="base">
    🪖 MILITARY BASE
  </div>

  <div class="building building1">🏢</div>
  <div class="building building2">🏢</div>

  <div class="village">
    🏘️ VILLAGE
  </div>

<div class="mountains">
  🏔️ MOUNTAINS
</div>

<div class="teammate" id="teammate">👤</div>

<div class="mission2" id="mission2">🏔️</div>

<div id="message2">
  <h2>MISSION 2: MOUNTAIN SEARCH</h2>
  <p>Find your missing teammate in the mountains.</p>
  <button id="startMission2">START MISSION 2</button>
</div>

<div class="downtown">
  🏙️ DOWNTOWN
</div>

<div class="beach">
  🏖️ BEACH
</div>

<div class="industrial">
  🏭 INDUSTRIAL ZONE
</div>
  
  <div class="mission" id="mission">🎯</div>

  <div id="message">
    <h2>MISSION 1: FIRST DEPLOYMENT</h2>
    <p>Reach the military base.</p>
    <button id="startMission">START MISSION</button>
  </div>

  <div id="player">🧍</div>

</div>

<p>W A S D / Arrow Keys — Move</p>

<script src="game.js"></script>

</body>
</html>
